name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run

  spec-drift:
    name: Vendored spec equals the live contract
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-review')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          curl --fail --silent --show-error --max-time 30 \
            https://adinize.ai/api/server/v1/openapi.yaml -o live.yaml
          diff -u spec/server-events-v1.yaml live.yaml
